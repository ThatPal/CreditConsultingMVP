services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: credit_strategy
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit_dev
    ports:
      - '5433:5432'
    volumes:
      - credit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U credit -d credit_strategy']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  credit_postgres_data:
