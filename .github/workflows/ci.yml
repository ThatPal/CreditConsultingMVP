name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: credit_strategy, POSTGRES_USER: credit, POSTGRES_PASSWORD: credit_dev }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U credit -d credit_strategy"
          --health-interval 5s --health-timeout 5s --health-retries 10
      astra-isolated:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_DB: credit_strategy_astra_u0,
            POSTGRES_USER: credit,
            POSTGRES_PASSWORD: credit_dev,
          }
        ports: ['127.0.0.1:5446:5432']
        options: >-
          --health-cmd "pg_isready -U credit -d credit_strategy_astra_u0"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://credit:credit_dev@localhost:5432/credit_strategy?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed:system
      - run: pnpm db:seed:system
      - run: pnpm lint
      - run: pnpm typecheck
      # This destructive fixture must never run on the ordinary database.
      - name: Provision isolated REC-02 database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U credit credit_strategy_rec02_com01a
      - name: Migrate isolated REC-02 database
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://credit:credit_dev@localhost:5432/credit_strategy_rec02_com01a?schema=public
      - name: REC-02 commerce integrity (six cases, fake transports)
        run: pnpm --filter @credit/api test:commerce-integrity
        env:
          DATABASE_URL: postgresql://credit:credit_dev@localhost:5432/credit_strategy_rec02_com01a?schema=public
      - name: ENTRY-F1 database guard rejection checks
        run: node --test scripts/entry-f1-guard.test.mjs
      - name: Provision isolated ENTRY-F1 database
        run: docker exec "${{ job.services.postgres.id }}" createdb -U credit credit_strategy_entry_f1_test
      - name: Migrate isolated ENTRY-F1 database
        run: node scripts/entry-f1-guard.mjs && pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://credit:credit_dev@localhost:5432/credit_strategy_entry_f1_test?schema=public
      - name: ENTRY-F1 commands and public intake (controlled email)
        run: pnpm --filter @credit/api test:entry-f1
        env:
          DATABASE_URL: postgresql://credit:credit_dev@localhost:5432/credit_strategy_entry_f1_test?schema=public
      # Existing Astra guards require this exact loopback target. Fixtures seed themselves.
      - name: Migrate isolated Astra database
        run: pnpm db:migrate:deploy
        env:
          DATABASE_URL: postgresql://credit:credit_dev@127.0.0.1:5446/credit_strategy_astra_u0?schema=public
      - name: Astra Plan reconciliation and workspace lifecycle (sequential)
        run: pnpm --filter @credit/api test:astra-isolated
        env:
          DATABASE_URL: postgresql://credit:credit_dev@127.0.0.1:5446/credit_strategy_astra_u0?schema=public
      - run: pnpm test
      - run: pnpm build
