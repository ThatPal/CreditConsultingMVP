name: credit-astra
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: credit_strategy_astra
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit_astra_dev
    ports: ['127.0.0.1:5445:5432']
    volumes: ['astra_postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U credit -d credit_strategy_astra']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6395:6379']
    volumes: ['astra_redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  astra_postgres_data:
  astra_redis_data:
